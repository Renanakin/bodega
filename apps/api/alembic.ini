# Alembic configuration (ADR-0001).
# La URL se inyecta dinámicamente desde app.core.config en env.py.
# NO hardcodear URLs aquí (R1).

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# sqlalchemy.url se sobreescribe en env.py desde Settings

[post_write_hooks]
# Hooks opcionales para formatear las migraciones generadas

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
