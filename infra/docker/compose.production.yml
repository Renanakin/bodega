services:
  db:
    restart: always

  redis:
    restart: always

  api:
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  web:
    restart: always
    environment:
      - VITE_API_URL=/api/v1

  nginx:
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/production.conf:/etc/nginx/conf.d/default.conf:ro
