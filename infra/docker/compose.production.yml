# compose.production.yml
# Override de produccion con endurecimiento de Fase 10.
#
# Cambios vs compose.local.yml:
# - restart: always en servicios criticos (auto-recovery ante crash).
# - Sin volumes bind-mount (codigo va DENTRO de la imagen).
# - api: uvicorn SIN --reload (overhead de dev).
# - nginx: expone 80 (HTTP) y 443 (HTTPS si hay certs montados).
# - worker: sigue al api (misma imagen, comando distinto via entrypoint).
# - db/redis: NO exponen puertos al host (solo accesibles en la red interna).
#
# TLS:
# - Opcion A: TLS terminado en este Nginx (mount /etc/nginx/certs + ssl.conf).
# - Opcion B: TLS terminado en un ALB/CloudFront frente a este Nginx.
#   Esta plantilla asume Opcion A (todo-en-uno); para Opcion B, quitar el
#   puerto 443 y confiar en el X-Forwarded-Proto del load balancer.
#
# Backups:
# - Servicio `backup` (sidecar) corre el script backup-postgres.sh en cron
#   diario. Solo presente en production.

services:
  # ---------------------------------------------------------------- db
  db:
    restart: always
    # No exponer puerto al host - solo accesible desde la red de compose.
    # ports: []
    volumes:
      # Named volume para persistencia (creado en el bloque volumes:).
      - postgres_prod_data:/var/lib/postgresql/data
      - ../../db/schema:/docker-entrypoint-initdb.d:ro
    environment:
      # Las credenciales vienen del .env (NO hardcodear).
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

  # --------------------------------------------------------------- redis
  redis:
    restart: always
    # Sin expose al host.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    volumes:
      - redis_prod_data:/data

  # --------------------------------------------------------------- mailpit
  # En produccion mailpit NO se usa (reemplazado por SES/SMTP real).
  # Comentado para ahorrar recursos; descomentar solo para debug temporal.
  # mailpit:
  #   image: axllent/mailpit:latest
  #   restart: always

  # ---------------------------------------------------------------- api
  api:
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=json
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - REDIS_URL=${REDIS_URL:?REDIS_URL must be set}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in production}
      - PASSWORD_HASH_ITERATIONS=${PASSWORD_HASH_ITERATIONS:-600000}
      - SMTP_HOST=${SMTP_HOST:?SMTP_HOST must be set}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:?SMTP_FROM must be set}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must be set}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=production
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      - METRICS_ENABLED=true
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
    # Sin bind-mount del codigo (la imagen lo trae baked-in).
    # volumes: []
    # Sin expose al host - solo accesible via nginx.
    # ports: []
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # --------------------------------------------------------------- worker
  worker:
    restart: always
    command: arq app.worker.WorkerSettings
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=json
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - REDIS_URL=${REDIS_URL:?REDIS_URL must be set}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - SMTP_HOST=${SMTP_HOST:?SMTP_HOST must be set}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:?SMTP_FROM must be set}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must be set}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # ---------------------------------------------------------------- web
  web:
    restart: always
    environment:
      - VITE_API_URL=/api/v1
      - NODE_ENV=production
    # Sin bind-mount.
    # volumes: []

  # -------------------------------------------------------------- nginx
  nginx:
    restart: always
    # TLS opcional: si /etc/nginx/certs existe con fullchain.pem + privkey.pem,
    # Nginx puede terminar TLS directamente (descomentar listen 443 + ssl).
    ports:
      - "80:80"
      # - "443:443"   # descomentar si se monta TLS en este contenedor
    volumes:
      - ./nginx/conf.d/production.conf:/etc/nginx/conf.d/default.conf:ro
      # Certs TLS opcionales (montar solo si se hace TLS en este Nginx):
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web

  # --------------------------------------------------------------- backup
  # Sidecar que corre pg_dump en cron diario. Solo presente en production.
  # Requiere que BACKUP_DIR exista en el host o se monte como volumen.
  backup:
    image: prodrigestivill/postgres-backup-local
    restart: always
    # Programar cron: 02:30 UTC diario (off-peak).
    # SCHEDULE viene del .env. POSTGRES_* se inyectan del .env tambien.
    environment:
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=${BACKUP_RETENTION_DAILY:-7}
      - BACKUP_KEEP_WEEKS=${BACKUP_RETENTION_WEEKLY:-4}
      - BACKUP_KEEP_MONTHS=${BACKUP_RETENTION_MONTHLY:-12}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - S3_BUCKET=${BACKUP_S3_BUCKET:-}
      - S3_REGION=${AWS_REGION:-us-east-1}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
    volumes:
      # Volumen nombrado para backups locales (acceder via docker volume inspect).
      - bodegaje_backups:/backups
    # Comando custom para usar S3 si esta configurado.
    entrypoint: |
      sh -c '
      if [ -n "$S3_BUCKET" ] && command -v aws >/dev/null 2>&1; then
        echo "Backup con upload S3 habilitado: $S3_BUCKET"
      fi
      # Inicia el cron daemon del entrypoint default.
      exec /run.sh
      '
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_prod_data:
  redis_prod_data:
  bodegaje_backups:
