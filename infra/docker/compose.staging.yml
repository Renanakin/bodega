# =============================================================================
# compose.staging.yml — Override del stack principal para STAGING (C4)
# =============================================================================
# Diferencias vs production:
# - API/worker/DB/Redis NO exponen puertos al host (solo Nginx publica el 8080)
# - Mailpit SI expone 8025 para inspeccion manual de emails
# - Web NO expone puerto (Nginx hace de proxy)
# - Nginx expone 8080 (no 80) para no chocar con dev local
#
# Uso:
#   docker compose \
#     -f infra/docker/docker-compose.yml \
#     -f infra/docker/compose.staging.yml \
#     up --build -d
#
# Pre-requisito: existe .env.staging con secretos de staging.
# =============================================================================

services:
  # Nginx expone 8080 (no 80) para no chocar con dev.
  nginx:
    ports:
      - "8080:80"
    environment:
      - ENVIRONMENT=staging

  # Web NO expone puerto (Nginx lo sirve en /).
  web:
    ports: []

  # API NO expone puerto (Nginx hace de proxy a api:8000).
  api:
    ports: []
    environment:
      - ENVIRONMENT=staging
      - APP_NAME=Bodegaje API (staging)
      - APP_VERSION=0.1.0-staging
      - DATABASE_URL=postgresql+asyncpg://bodegaje:bodegaje@db:5432/bodegaje
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env.staging}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env.staging}
      - CORS_ALLOWED_ORIGINS=http://localhost:8080,http://127.0.0.1:8080
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM=${SMTP_FROM:-noreply@staging.bodega.cl}
      - SMTP_TLS=false
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8080}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - METRICS_ENABLED=true
    # entrypoint: corre migrations antes de levantar uvicorn (mismo patron que dev)
    entrypoint:
      - bash
      - -c
      - |
        set -euo pipefail
        echo "[staging] corriendo alembic upgrade head..."
        alembic upgrade head
        echo "[staging] schema OK; arrancando uvicorn..."
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ../../apps/api:/app

  # Worker tambien corre migrations primero (idempotente).
  worker:
    ports: []
    environment:
      - ENVIRONMENT=staging
      - DATABASE_URL=postgresql+asyncpg://bodegaje:bodegaje@db:5432/bodegaje
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env.staging}
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM=${SMTP_FROM:-noreply@staging.bodega.cl}
      - SMTP_TLS=false
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8080}
      - LOG_LEVEL=INFO
    volumes:
      - ../../apps/api:/app

  # DB NO expone puerto (Nginx no lo necesita; solo API/worker se conectan).
  db:
    ports: []
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data

  # Redis NO expone puerto.
  redis:
    ports: []

  # Mailpit SI expone 8025 para inspeccion manual de emails enviados.
  mailpit:
    ports:
      - "8025:8025"
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_MAX_MESSAGES=10000

volumes:
  postgres_staging_data:
