# =============================================================================
# tls.conf - Nginx con HTTPS (F1 del roadmap 100% produccion)
# =============================================================================
# Configuracion para dev/staging con cert self-signed. En PRODUCCION real
# usar:
#   - certbot + Let's Encrypt (gratis, renovacion automatica) si es VPS
#   - ACM/ALB-managed cert (gratis, automatico) si es cloud AWS
#   - O el cert montado desde un secrets manager
#
# Para generar un cert self-signed nuevo (valido por 365 dias):
#   openssl req -x509 -nodes -newkey rsa:2048 \
#     -keyout infra/docker/nginx/ssl/server.key \
#     -out infra/docker/nginx/ssl/server.crt \
#     -days 365 \
#     -subj "/C=CL/ST=RM/L=Santiago/O=Bodegaje/OU=Dev/CN=localhost" \
#     -addext "subjectAltName=DNS:localhost,DNS:*.localhost,IP:127.0.0.1"
#
# Verificacion:
#   curl -kI https://localhost/  # -k ignora cert invalido (self-signed)
#   curl -I http://localhost/      # debe redirigir 301 a https
#
# Criterios Go/No-Go F1:
#   - curl -I https://localhost/ -> 200 + HSTS
#   - curl -I http://localhost/  -> 301 redirect a https://
#   - Headers de seguridad presentes: HSTS, X-Frame-Options, CSP
# =============================================================================

# Diffie-Hellman params (mas seguro que el default 1024-bit).
# Generar con: openssl dhparam -out dhparam.pem 2048
# Si el archivo no existe, nginx usa el default (1024-bit, menos seguro
# pero funciona). Para dev, el default es OK.
ssl_dhparam /etc/nginx/dhparam.pem;

# Session cache (mejora performance TLS en conexiones repetidas).
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Protocolos y cipher suites (Mozilla intermediate, 2024).
# Solo TLS 1.2 y 1.3. Nada de TLS 1.0/1.1 (deprecados, inseguros).
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

# OCSP stapling (verificacion activa de revocacion del cert).
ssl_stapling on;
ssl_stapling_verify on;

# --- Servidor HTTP (puerto 80): redirect a HTTPS --------------------
server {
    listen 80;
    server_name _;

    # ACME challenge (Let's Encrypt): permitir HTTP solo para validar dominio.
    # En dev, redirigir todo a HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demas: 301 a HTTPS permanente.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Servidor HTTPS (puerto 443) --------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Cert y key (montados via docker volume o secrets).
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    client_max_body_size 50m;  # permitir uploads de prueba

    # --- Headers de seguridad (estan en production.conf tambien,
    # pero los duplicamos aca para que el server TLS tenga los headers
    # ANTES de cualquier reverse proxy externo).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    # --- Healthcheck (no pasar por rate limit) -----------------------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --- API (con TLS) ---------------------------------------------
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # IMPORTANTE: con TLS en este mismo nginx, el esquema es https.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --- Frontend (Vite build via nginx interno) -------------------
    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;
    }
}
