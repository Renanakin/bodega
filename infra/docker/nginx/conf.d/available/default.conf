# =============================================================================
# default.conf — Nginx dev (Fase 10, hardening minimo)
# =============================================================================
# En dev, mantenemos una config SIMPLE sin rate limit (para no entorpecer
# el desarrollo) pero con:
# - X-Correlation-ID preservation (para que structlog correlacione logs)
# - Headers basicos de seguridad
# - /healthz endpoint para compose healthcheck
# =============================================================================

server_tokens off;

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;  # mas permisivo en dev (uploads de prueba)

    # Headers basicos (sin HSTS porque dev es HTTP).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Healthcheck endpoint.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preservar correlation_id (Fase 9) para trazabilidad.
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }

    location /docs {
        proxy_pass http://api:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://api:8000/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }
}
