# =============================================================================
# production.conf — Nginx production hardening (Fase 10)
# =============================================================================
# Hardening aplicado:
# - server_tokens off: oculta la version de Nginx en headers y paginas de error.
# - client_max_body_size 10m: limita uploads (mitigacion DoS por archivos grandes).
# - Rate limit: 100 req/min general, 5 req/min en endpoints publicos OC.
# - Headers de seguridad (verificados en securityheaders.com):
#   * Strict-Transport-Security: fuerza HTTPS por 1 anio, incluye subdominios, opt-in HSTS preload.
#   * X-Frame-Options: DENY (clickjacking).
#   * X-Content-Type-Options: nosniff (mitigacion MIME confusion).
#   * Referrer-Policy: strict-origin-when-cross-origin.
#   * Content-Security-Policy: default-src 'self' (mitigacion XSS).
#   * Permissions-Policy: deshabilita geolocation/microphone/camera.
# - X-Correlation-ID: preserva el header entrante para trazabilidad end-to-end.
# - Compresion gzip para assets texto (CSS, JS, JSON, HTML).
# - Log format JSON: parseable por Datadog/Loki directamente.
# - Proxy HTTP 1.1 con timeouts explicitos.
#
# Configuracion esperada:
# - En este contenedor solo hay HTTP (puerto 80).
# - TLS se termina en un reverse proxy externo (CloudFront, ALB, Caddy, etc)
#   o se configura este mismo Nginx con un cert mount + listen 443.
# - En este template usamos HSTS para forzar HTTPS en el cliente, asumiendo
#   que hay un TLS terminator arriba.
# =============================================================================

# --- Ocultar version de Nginx (mitigacion de fingerprinting) -----------
server_tokens off;

# --- Rate limit zones (definidas a nivel http{} o aqui en server{}) -----
# zone=general: 10MB de estado, ~160k IPs unicas. 100 req/min por IP.
# zone=public_oc: mas restrictivo para endpoints publicos de aprobacion OC.
# La zona se declara con limit_req_zone (http context) — referencia abajo.
limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=public_oc:5m rate=5r/m;
limit_req_status 429;

# --- Log format JSON para parseo por Datadog/Loki/etc -----------------
# escape=json garantiza que valores con comillas/newlines no rompen el JSON.
log_format json escape=json '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request_method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"server_protocol":"$server_protocol",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_addr":"$upstream_addr",'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"http_x_correlation_id":"$http_x_correlation_id",'
    '"http_x_forwarded_for":"$http_x_forwarded_for",'
    '"host":"$host"'
'}';

# --- Compresion gzip (assets texto) -----------------------------------
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;

server {
    listen 80;
    server_name _;

    # Limite de tamano de body (mitigacion DoS).
    client_max_body_size 10m;

    # Limite de tamano de headers (mitigacion slowloris).
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 10s;
    keepalive_timeout 30s;

    # --- Access log en formato JSON -----------------------------------
    access_log /var/log/nginx/access.log json;

    # --- Headers de seguridad (aplican a TODAS las respuestas) --------
    # HSTS: 1 anio + subdominios + opt-in para preload list.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Clickjacking: DENY (no permitir iframe ni del mismo origen).
    add_header X-Frame-Options "DENY" always;
    # MIME confusion: forzar que el browser respete el Content-Type.
    add_header X-Content-Type-Options "nosniff" always;
    # Referrer: solo enviar origen en cross-origin.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP: default-src 'self' permite recursos solo del mismo origen.
    # NOTA: el frontend (Vite build) puede necesitar ajustes si inline scripts
    # son requeridos. Por ahora default estricto; revisar en deploy real.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    # Permissions Policy: deshabilitar APIs sensibles.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    # --- Healthcheck endpoint (no pasar por rate limit) ----------------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --- Endpoints publicos OC (rate limit estricto) ------------------
    # Aprobacion / rechazo de OC via token (sin auth, validados por HMAC).
    # Rate limit: 5 req/min por IP. burst=10 permite pequenos picos legitimos.
    location ~ ^/api/v1/public/ordenes-compra/ {
        # Aplicar rate limit ANTES de proxy_pass.
        limit_req zone=public_oc burst=10 nodelay;
        limit_req_log_level warn;

        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preservar correlation_id entrante para trazabilidad del supervisor.
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # --- API general (rate limit general) ------------------------------
    location /api/ {
        # Rate limit: 100 req/min por IP. burst=20 permite picos cortos.
        limit_req zone=general burst=20 nodelay;
        limit_req_log_level warn;

        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preservar correlation_id entrante (generado por el cliente o el load balancer).
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --- Documentacion (deshabilitar en prod via env) -----------------
    # NOTA: en produccion la API ya bloquea /docs (main.py: docs_url=None).
    # Mantenemos los location blocks por si se reactiva, pero los restreingimos
    # a un rate limit bajo para evitar abuse.
    location /docs {
        limit_req zone=general burst=5 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /redoc {
        limit_req zone=general burst=5 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # --- Metricas Prometheus (restringido a red interna) ---------------
    # En produccion, /metrics SOLO debe ser accesible desde el scraper
    # de Prometheus (mismo docker network o VPN). En este template esta
    # expuesto en la API y protegido solo por rate limit.
    # Para maximo hardening, mover /metrics a un puerto separado o
    # configurar un reverse proxy adicional que solo acepte la IP del scraper.
    location = /metrics {
        limit_req zone=general burst=10 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Remover headers de autorizacion si los hay (no exponer).
        proxy_pass_request_headers off;
    }

    # --- Frontend (Vite build) -----------------------------------------
    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preservar correlation_id para trazabilidad end-to-end.
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;
    }

    # --- Paginas de error custom (no filtrar info de Nginx) ------------
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        return 500 "Service temporarily unavailable\n";
        add_header Content-Type text/plain;
    }
    location = /404.html {
        internal;
        return 404 "Not found\n";
        add_header Content-Type text/plain;
    }
}
