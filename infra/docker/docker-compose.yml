services:
  db:
    image: postgres:17-alpine
    container_name: bodegaje-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bodegaje
      POSTGRES_USER: bodegaje
      POSTGRES_PASSWORD: bodegaje
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../db/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bodegaje -d bodegaje"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: bodegaje-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    build:
      context: ../../apps/api
    container_name: bodegaje-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../../apps/api:/app
    environment:
      - PYTHONUNBUFFERED=1
      - APP_NAME=Bodegaje API
      - APP_VERSION=0.1.0
      - API_V1_PREFIX=/api/v1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: bodegaje-web
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost/api/v1
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    container_name: bodegaje-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  redis_data:
