services:
  db:
    image: postgres:17-alpine
    container_name: bodegaje-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bodegaje
      POSTGRES_USER: bodegaje
      POSTGRES_PASSWORD: bodegaje
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../db/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bodegaje -d bodegaje"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: bodegaje-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  mailpit:
    # Servidor SMTP dev + UI web (Fase 7, ADR-0004).
    # - Puerto 1025: SMTP entrante (sin auth, sin TLS).
    # - Puerto 8025: UI web para inspeccionar los emails.
    # Solo presente en perfiles dev/staging; en prod se usa SES/SendGrid.
    image: axllent/mailpit:latest
    container_name: bodegaje-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
      - MP_MAX_MESSAGES=5000
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    # Worker Arq: consume cola email + cron de replenishment (Fase 7).
    # Mismo codigo fuente que la API (bind-mount). En prod la imagen es
    # la misma con un comando distinto (entrypoint override).
    build:
      context: ../../apps/api
    container_name: bodegaje-worker
    restart: unless-stopped
    command: arq app.worker.WorkerSettings
    volumes:
      - ../../apps/api:/app
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://bodegaje:bodegaje@db:5432/bodegaje}
      - REDIS_URL=redis://redis:6379/0
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM=${SMTP_FROM:-noreply@bodegaje.example}
      - SMTP_TLS=false
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:5173}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started

  api:
    build:
      context: ../../apps/api
    container_name: bodegaje-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../../apps/api:/app
    environment:
      - PYTHONUNBUFFERED=1
      - APP_NAME=Bodegaje API
      - APP_VERSION=0.1.0
      - API_V1_PREFIX=/api/v1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: bodegaje-web
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost/api/v1
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    container_name: bodegaje-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  redis_data:
  mailpit_data:
