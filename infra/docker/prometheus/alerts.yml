# =============================================================================
# alerts.yml — Reglas de alertas de Prometheus para Bodegaje (C3.5)
# =============================================================================
# 6 alertas (4 normales + 2 criticas). Cada una con:
#   - Expresion PromQL
#   - Duracion minima (for:) para evitar flapping
#   - Labels (severity, service)
#   - Annotations (summary, description, runbook_url)
#
# El runbook esta en docs/operations/alerts/<nombre>.md
# =============================================================================

groups:
  # -----------------------------------------------------------------
  # API: latencia, errores, RPS
  # -----------------------------------------------------------------
  - name: bodegaje-api
    interval: 30s
    rules:
      # CRITICA: tasa de 5xx > 1% en 5 min
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{job="bodegaje-api",status=~"5.."}[5m]))
            /
          sum(rate(http_requests_total{job="bodegaje-api"}[5m]))
            > 0.01
        for: 5m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "Tasa de 5xx > 1% en los ultimos 5 minutos"
          description: |
            La API esta retornando errores 5xx a mas del 1% de los requests.
            Esto indica un problema serio (crash, BD caida, panic en middleware).
          runbook_url: "https://github.com/Renanakin/bodega/blob/main/docs/operations/alerts/high-error-rate.md"

      # WARNING: p95 de latencia > 1s
      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket{job="bodegaje-api"}[5m])) by (le)
          ) > 1.0
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "Latencia p95 > 1 segundo"
          description: |
            El percentil 95 de latencia HTTP supera 1s, lo que afecta la UX.
            Posibles causas: query lenta a Postgres, N+1, lock contention.
          runbook_url: "https://github.com/Renanakin/bodega/blob/main/docs/operations/alerts/high-latency.md"

      # WARNING: requests/seg cae a 0 (silencio total)
      - alert: NoTraffic
        expr: sum(rate(http_requests_total{job="bodegaje-api"}[5m])) == 0
        for: 10m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "Sin trafico HTTP por mas de 10 minutos"
          description: |
            La API no ha recibido requests en 10+ minutos. Puede ser:
            (a) carga de balanceador / proxy rota,
            (b) la app crasheo silenciosamente,
            (c) nadie esta usando el sistema.
          runbook_url: "https://github.com/Renanakin/bodega/blob/main/docs/operations/alerts/no-traffic.md"

  # -----------------------------------------------------------------
  # Postgres: conexiones, outbox, queries lentas
  # -----------------------------------------------------------------
  - name: bodegaje-database
    interval: 30s
    rules:
      # WARNING: conexiones a Postgres > 80% del max
      - alert: PostgresConnectionsHigh
        expr: |
          pg_stat_activity_count{datname="bodegaje"}
            /
          pg_settings_max_connections{setting="max_connections"} > 0.8
        for: 5m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "Conexiones a Postgres > 80% del maximo"
          description: |
            El pool de conexiones esta casi lleno. Riesgo de timeouts en
            requests nuevos. Considerar aumentar max_connections o
            optimizar queries.
          runbook_url: "https://github.com/Renanakin/bodega/blob/main/docs/operations/alerts/postgres-connections-high.md"

      # CRITICA: emails en outbox pendientes por mucho tiempo
      - alert: OutboxBacklog
        expr: bodegaje_email_outbox_pending > 100
        for: 10m
        labels:
          severity: critical
          service: worker
        annotations:
          summary: "Mas de 100 emails en outbox por 10+ minutos"
          description: |
            El worker Arq no esta procesando emails. Causas probables:
            (a) worker crasheo,
            (b) Redis caido,
            (c) SMTP no responde.
          runbook_url: "https://github.com/Renanakin/bodega/blob/main/docs/operations/alerts/outbox-backlog.md"

  # -----------------------------------------------------------------
  # Host: disco, memoria
  # -----------------------------------------------------------------
  - name: bodegaje-host
    interval: 30s
    rules:
      # WARNING: disco < 10% libre
      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} * 100)
            /
          node_filesystem_size_bytes{mountpoint="/"} < 10
        for: 30m
        labels:
          severity: warning
          service: host
        annotations:
          summary: "Disco < 10% libre por 30+ minutos"
          description: |
            El volumen raiz tiene menos del 10% libre. Riesgo de que
            Postgres o el sistema operativo fallen al escribir.
          runbook_url: "https://github.com/Renanakin/bodega/blob/main/docs/operations/alerts/disk-space-low.md"

      # WARNING: uso de memoria > 90%
      - alert: MemoryHigh
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 15m
        labels:
          severity: warning
          service: host
        annotations:
          summary: "Uso de memoria > 90% por 15+ minutos"
          description: |
            El sistema esta usando > 90% de RAM. Riesgo de OOM kills
            y degradacion de Postgres.
          runbook_url: "https://github.com/Renanakin/bodega/blob/main/docs/operations/alerts/memory-high.md"
